name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Build
      run: |
        # العثور على ملف الـ ZIP المرفوع تلقائياً
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Using zip file: $ZIP_FILE"
        
        # فك ضغطه في مجلد مؤقت
        mkdir source_code
        unzip -q "$ZIP_FILE" -d source_code
        
        # الدخول إلى المجلد المفقوك وضبط الصلاحيات
        cd source_code
        chmod +x gradlew || true
        
        # بناء التطبيق
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: source_code/app/build/outputs/apk/debug/app-debug.apk
