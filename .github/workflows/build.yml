name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Build
      run: |
        mkdir -p source_code
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        unzip -q "$ZIP_FILE" -d source_code
        
        # البحث عن المجلد الذي يحتوي على ملف الإعدادات الرئيسي للمشروع
        PROJECT_FILE=$(find source_code -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        
        echo "Project directory is: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # التأكد من وجود gradlew أو توليده إذا لم يكن موجوداً
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          source_code/**/app/build/outputs/apk/debug/app-debug.apk

