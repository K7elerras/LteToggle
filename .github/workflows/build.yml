name: Build APK from Zip

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Build
      run: |
        # إنشاء مجلد وفك الـ ZIP فيه
        mkdir -p source_code
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        unzip -q "$ZIP_FILE" -d source_code
        
        # البحث عن مكان تواجد ملف gradlew الحقيقي داخل المجلدات المفكوكة
        GRADLEW_PATH=$(find source_code -name "gradlew" -type f | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        
        echo "Found gradlew at: $GRADLEW_PATH"
        echo "Project directory is: $PROJECT_DIR"
        
        # إعطاء صلاحيات التنفيذ وبناء التطبيق
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          source_code/**/app/build/outputs/apk/debug/app-debug.apk
